[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "An AI agent that reads your resume, finds matching jobs in India across job boards and company career pages, and applies for you with your approval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.10",
    "python-jobspy>=1.4",
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "pydantic>=2.7",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
